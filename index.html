<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ashen ❤️ Ridmi Wedding Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
background:#000;
font-family:'Poppins',sans-serif;
color:white;
overflow-x:hidden;
}

#sparkles{
position:fixed;
width:100%;
height:100%;
pointer-events:none;
z-index:1;
}

.sparkle{
position:absolute;
color:gold;
animation:twinkle 4s linear infinite;
}

@keyframes twinkle{
0%{opacity:0;transform:translateY(0);}
50%{opacity:1;}
100%{opacity:0;transform:translateY(-50px);}
}

#welcomeScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
linear-gradient(
135deg,
#000,
#111,
#1a1a1a
);
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.welcomeContent{
text-align:center;
padding:20px;
animation:float 4s ease-in-out infinite;
}

.crown{
font-size:60px;
margin-bottom:10px;
}

.title{
letter-spacing:4px;
color:gold;
font-size:13px;
}

.welcomeContent h1{
font-family:'Great Vibes',cursive;
font-size:60px;
color:gold;
text-shadow:0 0 20px gold;
margin:10px 0;
}

.date,
.venue{
color:white;
margin:8px 0;
}

.enterBtn{
display:inline-block;
margin-top:25px;
padding:14px 30px;
background:gold;
color:black;
font-weight:bold;
border-radius:40px;
cursor:pointer;
box-shadow:0 0 20px gold;
}

@keyframes float{
50%{
transform:translateY(-10px);
}
}

.fadeOut{
animation:fadeOut 1s forwards;
}

@keyframes fadeOut{
to{
opacity:0;
visibility:hidden;
}
}

.container{
display:none;
padding:20px;
position:relative;
z-index:5;
}

.hero{
padding-top:30px;
}

.name{
font-family:'Great Vibes',cursive;
font-size:55px;
color:gold;
text-shadow:0 0 20px gold;
}

.subtitle{
line-height:1.9;
margin-top:15px;
color:#eee;
}

.infoCard{
margin:25px auto;
padding:18px;
max-width:500px;
border:1px solid gold;
border-radius:20px;
background:rgba(255,215,0,.08);
backdrop-filter:blur(10px);
}

.infoCard p{
margin:10px 0;
}

#guest{
font-size:22px;
color:gold;
margin-bottom:15px;
}

#countdown{
margin-top:20px;
font-size:20px;
font-weight:600;
color:gold;
line-height:1.8;
}

.slider{
width:95%;
max-width:420px;
margin:30px auto;
overflow:hidden;
border-radius:25px;
border:2px solid gold;
box-shadow:0 0 25px rgba(255,215,0,.4);
}

.slider img{
width:100%;
height:450px;
object-fit:cover;
display:block;
cursor:pointer;
}

.button{
display:inline-block;
padding:14px 25px;
background:gold;
color:black;
text-decoration:none;
font-weight:700;
border-radius:40px;
margin:10px;
}

iframe{
margin-top:20px;
border:2px solid gold;
border-radius:20px;
}

.contact-box{
margin-top:40px;
padding:20px;
border:1px solid gold;
border-radius:20px;
}

.contact-box h2{
color:gold;
margin-bottom:15px;
}

.contact-btn{
display:block;
background:gold;
color:black;
padding:12px;
margin:10px auto;
max-width:250px;
border-radius:30px;
text-decoration:none;
font-weight:bold;
}

.footer{
margin-top:40px;
color:#999;
font-size:14px;
padding-bottom:30px;
}

#imgPopup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.95);
justify-content:center;
align-items:center;
z-index:99999;
}

#imgPopup img{
width:95%;
max-width:700px;
border:3px solid gold;
border-radius:20px;
}

#petals{
position:fixed;
width:100%;
height:100%;
pointer-events:none;
overflow:hidden;
z-index:2;
}

.petal{
position:absolute;
font-size:22px;
animation:fall linear infinite;
}

@keyframes fall{
0%{
transform:translateY(-10vh) rotate(0deg);
opacity:1;
}
100%{
transform:translateY(110vh) rotate(360deg);
opacity:.2;
}
}

canvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:3;
}

@media(max-width:600px){

.name{
font-size:45px;
}

.welcomeContent h1{
font-size:48px;
}

.slider img{
height:380px;
}

}

</style>
</head>

<body>

<div id="sparkles"></div>
<div id="petals"></div>

<div id="welcomeScreen">

<div class="welcomeContent">

<div class="crown">👑</div>

<p class="title">THE WEDDING OF</p>

<h1>Ashen ❤️ Ridmi</h1>

<p class="date">26 July 2028 • 9:30 AM</p>

<p class="venue">Golden Crown, Kandy</p>

<div class="enterBtn" onclick="enterSite()">
Open Invitation ✨
</div>

</div>

</div>

<div class="container" id="main">

<div class="hero">

<p id="guest"></p>

<div class="name">
Ashen ❤️ Ridmi
</div>

<p class="subtitle">
Together With Their Families<br>
Request The Pleasure Of Your Company<br>
At Their Wedding Celebration
</p>

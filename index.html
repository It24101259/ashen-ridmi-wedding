<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashen ❤️ Ridmi Wedding</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: black;
    color: gold;
    text-align: center;
    overflow-x: hidden;
}

/* Royal glow */
body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, rgba(255,215,0,0.18), transparent 60%);
    z-index: -1;
}

/* Loader */
#loader {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    animation: fadeOut 3s forwards;
    animation-delay: 2.5s;
}

#loader h1 {
    font-family: 'Great Vibes';
    font-size: 45px;
}

@keyframes fadeOut {
    to { opacity: 0; visibility: hidden; }
}

/* Main */
.container {
    padding: 20px;
    animation: fadeIn 2s ease-in;
}

@keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
}

/* Countdown */
#countdown {
    font-size: 20px;
    margin: 15px 0;
}

/* Slider */
.slider {
    width: 90%;
    max-width: 350px;
    margin: auto;
    overflow: hidden;
    border-radius: 15px;
    border: 2px solid gold;
}

.slides {
    display: flex;
    width: 500%;
    animation: slide 15s infinite;
}

.slides img {
    width: 100%;
}

@keyframes slide {
    0% {transform: translateX(0);}
    20% {transform: translateX(0);}
    25% {transform: translateX(-100%);}
    45% {transform: translateX(-100%);}
    50% {transform: translateX(-200%);}
    70% {transform: translateX(-200%);}
    75% {transform: translateX(-300%);}
    95% {transform: translateX(-300%);}
    100% {transform: translateX(-400%);}
}

/* Buttons */
button, a {
    background: gold;
    color: black;
    padding: 10px 18px;
    border: none;
    border-radius: 25px;
    margin: 8px;
    font-weight: bold;
    text-decoration: none;
    display: inline-block;
}

/* Confetti */
.confetti {
    position: fixed;
    width: 8px;
    height: 8px;
    background: gold;
    top: -10px;
    animation: fall linear infinite;
}

@keyframes fall {
    to {transform: translateY(100vh) rotate(360deg);}
}

/* Popup */
.popup {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: gold;
    color: black;
    padding: 10px 20px;
    border-radius: 20px;
    font-weight: bold;
    display: none;
}
</style>
</head>

<body>

<div id="loader">
    <h1>Ashen ❤️ Ridmi</h1>
    <p>Royal Wedding Invitation</p>
</div>

<div class="popup" id="popup"></div>

<div class="container">

    <h1 id="guest">Dear Guest 👑</h1>

    <h2>Ashen ❤️ Ridmi</h2>
    <p>We Invite You To Our Royal Wedding</p>

    <h3>26 July 2028 | 9:30 AM</h3>
    <p>Golden Crown, Kandy</p>

    <div id="countdown"></div>

    <!-- Slider -->
    <div class="slider">
        <div class="slides">
            <img src="photo1.jpg">
            <img src="photo2.jpg">
            <img src="photo3.jpg">
            <img src="photo4.jpg">
            <img src="photo5.jpg">
        </div>
    </div>

    <br>

    <a href="https://maps.app.goo.gl/4TyAPM71U2rcCSCC7" target="_blank">📍 Location</a>
    <a href="https://forms.gle/9AsxELdHc9a82fHp7" target="_blank">💌 RSVP</a>

    <button onclick="playMusic()">🎵 Music</button>

    <audio id="music" src="music.mp3"></audio>
</div>

<script>

// Guest name from URL
const params = new URLSearchParams(window.location.search);
const guest = params.get("guest");

if(guest){
    document.getElementById("guest").innerText = "Welcome " + guest + " 👑";
    showPopup("Welcome " + guest + " 💌");
}

// Popup
function showPopup(text){
    let p = document.getElementById("popup");
    p.innerText = text;
    p.style.display = "block";
    setTimeout(()=>p.style.display="none",3000);
}

// Countdown
const eventDate = new Date("July 26, 2028 09:30:00").getTime();

setInterval(()=>{
    let now = new Date().getTime();
    let d = eventDate - now;

    document.getElementById("countdown").innerHTML =
    Math.floor(d/(1000*60*60*24)) + " Days " +
    Math.floor((d%(1000*60*60*24))/(1000*60*60)) + " Hours " +
    Math.floor((d%(1000*60*60))/(1000*60)) + " Min";
},1000);

// Music
function playMusic(){
    document.getElementById("music").play();
}

// Confetti
for(let i=0;i<50;i++){
    let c = document.createElement("div");
    c.classList.add("confetti");
    c.style.left = Math.random()*100+"vw";
    c.style.animationDuration = (2+Math.random()*3)+"s";
    c.style.background = Math.random()>0.5?"gold":"white";
    document.body.appendChild(c);
}

</script>

</body>
</html>
